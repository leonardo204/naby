<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나비 대화 참가자</title>
<style>
:root,[data-theme=light]{--stage:radial-gradient(1000px 640px at 8% 0%,#ECE6FF 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#E2F1FF 0%,transparent 60%),#F4F5F9;--panel:#fff;--card:#fff;--bg:#fff;--side:#F7F7FA;--ink:#1C1D22;--sub:#6B6F7B;--line:#E6E7EC;--soft:#F2F3F7;--pri:#6D4AFF;--pri2:#9B7BFF;--onpri:#fff;--chip:#EFEAFF;--ubub:#6D4AFF;--uink:#fff;--grad:linear-gradient(135deg,#6D4AFF 0%,#9B7BFF 100%);--shadow:0 30px 80px rgba(30,25,80,.18);--tbar:#ECECF0;--code:#F4F4F7;--ok:#12A06F;--warn:#C27C05;--bad:#E03B3B;--dim:rgba(20,18,40,.38)}
[data-theme=dark]{--stage:radial-gradient(1000px 640px at 8% 0%,#221A44 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#0F2236 0%,transparent 60%),#0E0F14;--panel:#16171D;--card:#1C1D25;--bg:#17181F;--side:#13141A;--ink:#EEEFF4;--sub:#9A9EAD;--line:#2A2C36;--soft:#22242D;--pri:#9B7BFF;--pri2:#C3B0FF;--onpri:#120D24;--chip:#2A2342;--ubub:#4A3B8C;--uink:#F1EDFF;--grad:linear-gradient(135deg,#7E5CFF 0%,#B8A2FF 100%);--shadow:0 30px 80px rgba(0,0,0,.55);--tbar:#1F2028;--code:#22242D;--ok:#3DD39A;--warn:#F5B544;--bad:#FF6B6B;--dim:rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--stage);color:var(--ink);display:flex;gap:20px;padding:22px;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .4s}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.sub{color:var(--sub)}.sm{font-size:12px}.xs{font-size:11px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip);color:var(--pri);white-space:nowrap}
.pill.gray{background:var(--soft);color:var(--sub)}.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.pill.vio{background:var(--chip);color:var(--pri)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:14px;font-weight:800;font-size:14.5px;background:var(--grad);color:var(--onpri);width:100%;white-space:nowrap;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 28%,transparent)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.sm{width:auto;min-width:62px;padding:0 12px;font-size:13.5px}
.btn.wait{opacity:.45;pointer-events:none}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px}
.seg button{flex:1;height:30px;border-radius:8px;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;padding:0 8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tapping{outline:3px solid color-mix(in srgb,var(--pri) 65%,transparent)!important;outline-offset:2px;transition:outline .1s}
.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 40%,transparent)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pri) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes slide{from{left:-35%}to{left:100%}}
@keyframes blink{50%{opacity:0}}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes drawer{from{transform:translateX(100%)}}
@keyframes up{from{transform:translateY(10px);opacity:0}}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.na{animation:none!important}

/* ===== stage & desktop window ===== */
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
#winwrap{position:relative;flex:none}
.win{position:absolute;left:0;top:0;width:1180px;height:760px;transform-origin:0 0;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow),0 0 0 1px var(--line);display:flex;flex-direction:column}
.tbar{height:38px;flex:none;display:flex;align-items:center;padding:0 14px;background:var(--tbar);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--sub);position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.tbar .tt{position:absolute;left:50%;transform:translateX(-50%)}
#app{flex:1;min-height:0;display:flex;position:relative}
.pchip{position:absolute;top:-2px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800;box-shadow:0 6px 16px rgba(20,20,60,.08);white-space:nowrap;z-index:5}
.pchip i{width:8px;height:8px;border-radius:50%;background:#9AA1AD}.pchip.play i{background:var(--pri);animation:pulse 1s infinite}.pchip.pause i{background:#F59E0B}.pchip.done i{background:var(--ok)}

/* sidebar */
.side{width:214px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;letter-spacing:-.3px;padding:0 8px 12px}
.brand .bf{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-size:14px}
.sgrp{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.4px;padding:10px 8px 4px}
.sitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem.on{background:color-mix(in srgb,var(--pri) 11%,transparent);color:var(--ink);font-weight:700}
.sitem .mini{display:flex;margin-left:auto}.sitem .mini span{font-size:10px;margin-left:-3px}
.sfoot{margin-top:auto;display:flex;gap:6px}
.sbtn{flex:1;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}

/* chat main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.chdr{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);position:relative;z-index:3;background:var(--bg)}
.chdr .ttl{font-weight:800;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap}.chdr .ttl small{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-top:1px}
.roster{display:flex;align-items:center;gap:6px;padding:4px;border-radius:99px;background:var(--soft)}
.rs{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 3px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;transition:all .25s;white-space:nowrap}
.rs.mini{padding:0 3px;opacity:.75}
.rs .ra{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--c) 18%,var(--card));flex:none}
.rs.speak{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.rs.speak .ra{animation:spk 1s infinite}
@keyframes spk{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.rs .lk{font-size:9.5px;color:var(--sub);font-weight:700}
.radd{width:30px;height:30px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--pri) 55%,var(--line));color:var(--pri);font-size:17px;font-weight:700;display:grid;place-items:center;background:var(--card)}
.hbtn{height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn .sw{width:26px;height:15px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.hbtn .sw:after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s}
.hbtn.on{border-color:var(--pri);color:var(--pri)}.hbtn.on .sw{background:var(--pri)}.hbtn.on .sw:after{left:13px}
.hbtn .cnt{background:var(--soft);border-radius:6px;padding:0 5px;font-size:10.5px;color:var(--sub)}
.addmenu{position:absolute;top:56px;left:250px;width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(20,20,60,.18);z-index:8;padding:8px;animation:up .2s}
.addmenu .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px;font-size:12px;font-weight:800}
.amit{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:10px}
.amit:hover{background:var(--soft)}
.amit .av{margin-top:2px}
.amit .d{font-size:11.5px;color:var(--sub);line-height:1.45;margin-top:2px}
.amit button{height:28px;padding:0 11px;border-radius:8px;background:var(--chip);color:var(--pri);font-size:12px;font-weight:800;flex:none;align-self:center}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;background:color-mix(in srgb,var(--c,#888) 18%,var(--card));border:1px solid color-mix(in srgb,var(--c,#888) 35%,transparent)}
.av.lg{width:42px;height:42px;font-size:21px}
.av.sm{width:22px;height:22px;font-size:11px}

.msgs{flex:1;overflow-y:auto;padding:20px 30px 14px;display:flex;flex-direction:column;gap:12px}
.dr .msgs,.dr .cmp{padding-right:390px}
.mu{display:flex;justify-content:flex-end}
.mu .bu{max-width:62%;background:var(--ubub);color:var(--uink);padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.55}
.att{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;margin-bottom:6px}
.ma{display:flex;gap:10px;align-items:flex-start;max-width:74%;animation:up .25s}
.ma .who{font-size:12px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.ma .bub{font-size:13.5px;line-height:1.6}
.ma.part .bub{background:color-mix(in srgb,var(--c) 6%,var(--card));border:1px solid color-mix(in srgb,var(--c) 26%,var(--line));border-left:3px solid var(--c);padding:10px 14px;border-radius:4px 14px 14px 14px}
.ma.naby .bub{padding:2px 0}
.relay{font-size:10px;font-weight:700;color:var(--sub);background:var(--soft);border-radius:6px;padding:1px 6px;display:inline-flex;gap:3px;align-items:center}
.li{padding-left:14px;position:relative}.li:before{content:"•";position:absolute;left:3px;color:var(--sub)}
.mn{color:var(--c);font-weight:800;background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:5px;padding:0 3px}
.mn.off{color:var(--sub);background:var(--soft);text-decoration:line-through dotted;font-weight:700}
.stopped{display:inline-flex;margin-top:6px;font-size:11px;font-weight:800;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:6px;padding:1px 7px}
.knw{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.msys{align-self:center;font-size:11.5px;color:var(--sub);background:var(--soft);border-radius:99px;padding:4px 12px;font-weight:600;animation:fade .3s}
.msys.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);font-weight:800}
.msys.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);font-weight:800}
.mr{align-self:flex-start;margin-left:40px;font-size:11px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--pri);background:var(--chip);border:1px dashed color-mix(in srgb,var(--pri) 45%,transparent);border-radius:8px;padding:4px 9px;animation:drop .3s}
.mr.ignore{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.mr.pick{color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.mr small{color:var(--sub);font-weight:600;margin-left:6px}
.typing{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:600;padding-left:2px}
.dots{display:inline-flex;gap:3px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--sub);animation:dots 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
/* approval card */
.apc{align-self:flex-start;margin-left:40px;width:460px;border:1.5px solid color-mix(in srgb,var(--pri) 45%,var(--line));border-radius:14px;background:var(--card);padding:12px 14px;box-shadow:0 8px 24px color-mix(in srgb,var(--pri) 12%,transparent);animation:up .3s}
.apc.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));box-shadow:none}.apc.no{border-color:var(--line);box-shadow:none;opacity:.9}
.aph{display:flex;align-items:center;gap:8px}
.apq{font-size:14px;font-weight:800;margin:9px 0 8px;letter-spacing:-.2px}
.apa{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--soft)}
.apw{font-size:12px;margin-top:8px;color:var(--ink)}.apw b{color:var(--pri)}
.apb{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.b2{height:32px;padding:0 16px;border-radius:9px;background:var(--grad);color:var(--onpri);font-size:12.5px;font-weight:800}
.b2.ghost{background:var(--soft);color:var(--ink)}
.b2.line{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.apr{margin-top:10px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px}
.apr.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.apr.no{color:var(--sub);background:var(--soft)}
/* composer */
.cmp{flex:none;padding:8px 30px 16px;position:relative}
.prog{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:7px 8px 7px 12px;border-radius:11px;background:var(--soft);font-size:12px;font-weight:700;position:relative;overflow:hidden;animation:up .2s}
.prog:after{content:'';position:absolute;left:0;bottom:0;height:2px;width:35%;background:var(--grad);animation:slide 1.3s linear infinite}
.prog .nx{color:var(--sub);font-weight:600}
.stopb{height:28px;padding:0 12px;border-radius:8px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.box{display:flex;align-items:flex-end;gap:8px;min-height:50px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:8px 8px 8px 14px}
.box.focus{border-color:var(--pri)}
.box .tx{flex:1;font-size:13.5px;line-height:1.5;padding:5px 0;min-height:24px;white-space:pre-wrap}
.box .ph{color:var(--sub)}
.caret{display:inline-block;width:1.5px;height:15px;background:var(--pri);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
.send{width:34px;height:34px;border-radius:10px;background:var(--grad);color:var(--onpri);display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.atpop{position:absolute;bottom:76px;left:30px;width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(20,20,60,.18);padding:6px;z-index:6;animation:up .15s}
.atpop .g{font-size:10.5px;font-weight:800;color:var(--sub);padding:6px 8px 3px;letter-spacing:.3px}
.ati{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:700}
.ati.sel{background:color-mix(in srgb,var(--pri) 12%,transparent)}
.ati.off{opacity:.5}
.ati small{font-weight:600;color:var(--sub);font-size:11px}
/* telegram mirror toast */
#tg{position:absolute;right:18px;bottom:96px;z-index:40}
.tgt{width:290px;border-radius:14px;background:#17212B;color:#E9EEF3;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:10px 12px;animation:drop .4s cubic-bezier(.2,.9,.3,1.2);font-size:12px;line-height:1.45}
.tgt .h{display:flex;align-items:center;gap:7px;font-weight:800;font-size:11.5px;color:#8FB8DE;margin-bottom:5px}
.tgt .h i{width:18px;height:18px;border-radius:50%;background:#2AABEE;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff}
.tgt .bt{display:flex;gap:6px;margin-top:8px}.tgt .bt span{flex:1;text-align:center;background:#2B5278;border-radius:7px;padding:5px 0;font-weight:800;font-size:11.5px}
#tst{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:45}
.toast{background:rgba(20,20,30,.92);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;animation:fade .2s}
/* activity log drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(20,20,60,.12);z-index:12;display:flex;flex-direction:column;animation:drawer .3s cubic-bezier(.2,.9,.3,1)}
.dh{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.dh small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.xb{width:28px;height:28px;border-radius:8px;background:var(--soft);font-size:13px}
.dbody{flex:1;overflow-y:auto;padding:6px 14px 16px}
.dsec{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.3px;padding:12px 2px 6px;display:flex;justify-content:space-between}
.lr{display:flex;gap:9px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.lr:last-child{border-bottom:0}
.lr .m{font-size:11px;color:var(--sub);margin-top:1px}
.lr .tk{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;white-space:nowrap}
.lr.chk .ic{width:22px;height:22px;border-radius:6px;background:var(--chip);color:var(--pri);display:grid;place-items:center;font-size:11px;flex:none}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tot div{background:var(--soft);border-radius:10px;padding:9px 10px;font-size:11px;color:var(--sub)}.tot b{display:block;font-size:16px;color:var(--ink)}
/* settings modal */
.mdim{position:absolute;inset:0;background:var(--dim);z-index:20;display:grid;place-items:center;animation:fade .2s}
.modal{width:900px;height:640px;background:var(--card);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.3);display:flex;overflow:hidden;position:relative;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.mnav{width:180px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:16px 10px}
.mnav .h{font-weight:900;font-size:15px;padding:0 8px 12px}
.nv{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:2px}
.nv.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--ink);font-weight:800}
.mbody{flex:1;overflow-y:auto;padding:22px 26px 26px;position:relative}
.mx{position:absolute;right:14px;top:14px;z-index:3}
.h2{font-size:18px;font-weight:800;letter-spacing:-.4px}
.h3{font-size:14px;font-weight:800;letter-spacing:-.2px}
.scard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.ncard{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--pri) 28%,var(--line))}
.ncard .bf{width:48px;height:48px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-size:24px;flex:none}

async function tap(id) {
  if (FAST) return; const e = $(id); if (!e) return;
  scrollToId(id, 120); await sleep(380); const el = $(id); if (!el) return; el.classList.add('tapping'); await sleep(360); const el2 = $(id); if (el2) el2.classList.remove('tapping'); await sleep(120);
}
async function typeInto(setter, text) { if (FAST) { setter(text); return; } for (let i = 1; i <= text.length; i++) { if (FAST) { setter(text); return; } setter(text.slice(0, i)); await sleep(30); } }
function josa(w, a, b) { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? b : a; }

/* ---------- message formatting ---------- */
function fmt(t, speaker) {
  let h = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/@(나비|번역가|리뷰어|기획자|민지)/g, (m, n) => {
    const id = NAMES[n]; const off = speaker && speaker !== 'naby' && id !== 'naby';
    return `<span class="mn ${off ? 'off' : ''}" style="--c:${AG[id].c}"${off ? ' title="참가자끼리의 멘션은 무시돼요"' : ''}>@${n}</span>`;
  });
  return h.split('\n').map(l => l.startsWith('- ') ? `<div class="li">${l.slice(2)}</div>` : `<div>${l || '&nbsp;'}</div>`).join('');
}

/* ---------- conversation helpers (state only; FAST-safe) ---------- */
function sys(t, tone = '', id) { S.msgs.push({ k: 'sys', t, tone, id }); render(); scrollBottom(); }
function route(t, kind = 'turn', meta = '', id) { S.msgs.push({ k: 'r', t, kind, meta, id }); render(); scrollBottom(); }
async function say(text, att) {
  S.set = null; S.addMenu = false; S.focusBox = true; render();
  await typeInto(v => { S.composer = v; S.atPop = /(^|\s)@\S*$/.test(v); S.atSel = null; render(); }, text);
  await sleep(250); S.atPop = false; render(); await tap('sendbtn');
  S.composer = ''; S.focusBox = false; S.msgs.push({ k: 'u', t: text, att }); render(); scrollBottom(); await sleep(450);
}
/* Naby's routing check (R3.6): structured result, hidden unless routing view is on. */
async function check(t, tok, kind = 'check', id) {
  S.checking = true; render(); scrollBottom(); await sleep(800); S.checking = false;
  S.msgs.push({ k: 'r', t, kind, meta: `확인 · routine · ${tok} tok`, id }); S.log.push({ k: 'c', t, tok }); render(); scrollBottom();
}
function mentionSkip(id, rid) {
  const t = `사용자 지목 @${AG[id].n} · 나비 확인 건너뜀`;
  S.msgs.push({ k: 'r', t, kind: 'pick', meta: '0 tok', id: rid }); S.log.push({ k: 'c', t, tok: 0, skip: 1 }); render(); scrollBottom();
}
async function speak(a, text, o = {}) {
  S.typing = a; S.speaking = a; if (o.run !== undefined) S.run = o.run; render(); scrollBottom(); await sleep(o.wait || 950);
  S.typing = null; const m = { k: 'a', a, t: '', relay: a !== 'naby', kn: o.kn }; S.msgs.push(m);
  const full = o.cut != null ? text.slice(0, o.cut) : text;
  if (!FAST) for (let i = 3; i < full.length && !FAST; i += 3) { m.t = full.slice(0, i); render(); scrollBottom(); await sleep(18); }
  m.t = full; render(); scrollBottom();
  if (o.cut != null) { await tap('stopbtn'); m.stopped = true; }
  S.log.push({ k: 's', a, tok: o.tok || (240 + full.length * 3), note: o.cut != null ? '정지됨 · 일부만 생성' : o.note || '' });
  if (!o.keep) S.speaking = null;
  render(); scrollBottom(); await sleep(350); return m;
}

}

/* ---------- fit the 1180x760 window into the stage ---------- */
function fit() {
  const st = $('stage'); const w = st.clientWidth, h = st.clientHeight - 34;
  SCALE = Math.max(.3, Math.min(1, w / 1180, h / 760));
  const ww = $('winwrap'); ww.style.width = 1180 * SCALE + 'px'; ww.style.height = 760 * SCALE + 'px'; ww.style.marginTop = '30px';
  $('win').style.transform = `scale(${SCALE})`;
}
window.addEventListener('resize', fit);

/* ---------- boot ---------- */
load(); document.body.dataset.theme = PREF.theme; fit(); render(); scrollBottom(); renderPanel();
</script>
