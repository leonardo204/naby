# .github/workflows/release.yml
#
# F1-10 — the three-OS release pipeline.
#
# WHY THREE SEPARATE JOBS AND NOT A ONE-JOB CROSS-BUILD. `.dmg` has a hard
# macOS-host guard in electron-builder's own source: it will refuse, not degrade,
# on a Linux runner. That alone forces macOS onto a macOS runner, and once the
# matrix exists there is no reason to cross-build the other two either — Windows
# NSIS and Linux AppImage/deb are each cheapest and least surprising on their
# native runner. Note `macos-latest` is arm64, which is why the mac target is
# pinned to arm64 in electron-builder.yml rather than attempting a universal
# binary (the universal asar merge is known-fragile and buys us nothing yet).
#
# BUILD ORDER IS A REAL DEPENDENCY, NOT A STYLE CHOICE. `build:runtime` produces
# `dist/naby-runtime.mjs`, which the shell's build imports; `build:shell` chains
# `build:runtime` for exactly that reason, and `build:app` chains `build:shell`
# then `build:electron`. Every job below calls `npm run dist:<os>`, which starts
# from `build:app` — so the ordering is enforced by the npm scripts and is not
# something this workflow can get wrong by listing steps in the wrong order.
#
# TAG-TRIGGERED. A release is `git tag v1.2.3 && git push --tags`. Pushing to a
# branch builds nothing; there is a manual `workflow_dispatch` for dry runs that
# deliberately does NOT publish.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to a GitHub Release (otherwise build only)'
        type: boolean
        default: false

# Required so electron-builder can create the release and upload assets.
# Scoped to contents deliberately — nothing here needs packages:, id-token: or
# anything wider.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # macOS — the only job that signs, notarises and staples
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (dmg + zip, signed & notarised)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The shell is a submodule and the app does not build without it.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GITHUB_TOKEN is here for `@vscode/ripgrep`, whose postinstall downloads a
      # prebuilt binary through the GitHub API. Unauthenticated, that call is
      # rate-limited per runner IP and returns 403 — which is how the macOS job
      # failed on the first v1.0.0 attempt, after four retries, before any of our
      # own code ran. The token only raises the rate limit; nothing is published.
      - name: Install root dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install shell dependencies
        working-directory: shell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # -----------------------------------------------------------------------
      # THE SIGNING IDENTITY IS A ONE-WAY DOOR — see electron-builder.yml.
      # Squirrel.Mac validates every future update against the designated
      # requirement of the app the user is ALREADY RUNNING. If this job ever
      # signs with a different certificate than the previous release, every
      # installed user silently loses auto-update forever and has to re-download
      # by hand. macOS offers no migration path for this; Windows does.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY is false so electron-builder cannot pick a
      # certificate off the keychain by itself — the identity is CSC_NAME and
      # nothing else.
      # -----------------------------------------------------------------------
      # THE KEYCHAIN IS OURS, NOT ELECTRON-BUILDER'S (since 2026-09-09).
      #
      # electron-builder can import CSC_LINK into a temporary keychain by itself,
      # and until the 2026-08-31 macos-26 runner image that is what this job
      # relied on. It broke on that image with
      #   security set-key-partition-list … SecKeychainUnlock: The user name or
      #   passphrase you entered is not correct.
      # The cause is in electron-builder (app-builder-lib 26.15.3, still present
      # in the latest release at the time of writing): `importCerts` passes the
      # .p12 PASSWORD as `-k` to set-key-partition-list, where the KEYCHAIN
      # password belongs. Older `security` builds let that through because the
      # keychain was already unlocked; the current one checks it and refuses.
      # Two runs failed identically (run 34294446162, attempts 1 and 2); the
      # previous release, five days earlier on image 20260728, passed with the
      # same secrets.
      #
      # So the import happens here, with the right password in the right place,
      # and electron-builder is handed the finished keychain via CSC_KEYCHAIN.
      # It takes that path only when CSC_LINK is ABSENT (macPackager.ts), which
      # is why the build step below no longer exports CSC_LINK/CSC_KEY_PASSWORD.
      # The identity is still pinned by CSC_NAME with auto-discovery off — the
      # one-way door above is untouched.
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ]; then
            echo "::error::CSC_LINK is not set. macOS releases must be signed — see the secrets table in the workflow header."
            exit 1
          fi
          CERT="$RUNNER_TEMP/developer-id.p12"
          # CSC_LINK is whatever electron-builder accepts: an https URL, or the
          # .p12 as base64 (with or without a data: prefix).
          case "$CSC_LINK" in
            https://*) curl -fsSL "$CSC_LINK" -o "$CERT" ;;
            *) printf '%s' "$CSC_LINK" | sed -e 's/^data:[^,]*,//' | tr -d '\n\r ' | base64 --decode > "$CERT" ;;
          esac
          test -s "$CERT" || { echo "::error::CSC_LINK did not decode to a certificate file"; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/naby-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock: notarisation can take longer than the default timeout.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          # The keychain password here — this is the line electron-builder gets
          # wrong.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          # The identity must be usable for codesigning from this keychain, or
          # the build would fail later with a less useful message.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID Application identity in the imported certificate"; exit 1; }
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarise, staple
        env:
          # Signing. The certificate is already in the keychain the previous
          # step built; CSC_KEYCHAIN (set there via GITHUB_ENV) points at it.
          # CSC_LINK/CSC_KEY_PASSWORD are deliberately NOT exported here — with
          # CSC_LINK set electron-builder would ignore CSC_KEYCHAIN and go back
          # to its own broken import (see the step above).
          CSC_NAME: ${{ secrets.CSC_NAME }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Notarisation (scripts/notarize.mjs → notarytool). altool is retired;
          # there is no fallback and none should be added.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Publishing only. This token never enters the artifact — the feed repo
          # is public precisely so no credential has to ship (design §6.3).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            npm run build:app && node scripts/build-dist.mjs --mac --publish always
          else
            npm run build:app && node scripts/build-dist.mjs --mac --publish never
          fi

      # The acceptance check for the macOS half of F1-10, run against the real
      # artifact rather than assumed from a green build. codesign proves it is a
      # Developer ID signature (not ad-hoc, which would pass a naive check and
      # break every future update); spctl proves Gatekeeper will open it; stapler
      # proves the ticket is embedded so the check works offline.
      - name: Verify signature, Gatekeeper and staple
        run: npm run verify:mac

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — NSIS, UNSIGNED, and auto-update works anyway
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (NSIS, unsigned)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GITHUB_TOKEN is here for `@vscode/ripgrep`, whose postinstall downloads a
      # prebuilt binary through the GitHub API. Unauthenticated, that call is
      # rate-limited per runner IP and returns 403 — which is how the macOS job
      # failed on the first v1.0.0 attempt, after four retries, before any of our
      # own code ran. The token only raises the rate limit; nothing is published.
      - name: Install root dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install shell dependencies
        working-directory: shell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # NO SIGNING STEP, DELIBERATELY (design §6.2). electron-updater skips
      # signature verification entirely when `publisherName` is null, which is
      # exactly the unsigned case, so Windows auto-update works today with no
      # certificate. Adding one later is a config change in electron-builder.yml
      # (azureSignOptions + a publisherName ARRAY containing the old and new
      # names so existing installs are not stranded), not a change here.
      #
      # A .pfx in CI secrets is no longer an option regardless: OV code-signing
      # keys have been required to live on FIPS 140-2 L2 hardware or a cloud HSM
      # since June 2023.
      # BUILD IN AN EMPTY HOME — the fix for the Windows build, and the reason
      # is worth stating because the workaround looks arbitrary otherwise.
      #
      # Something in `next build` walks the user profile. On macOS and Linux that
      # is merely wasteful; on a Windows runner C:\Users\<user> contains app
      # execution aliases under Microsoft\WindowsApps that are reparse points, and
      # scandir on them raises EACCES:
      #
      #   glob error [EACCES: permission denied, scandir
      #     'C:\Users\runneradmin\Local Settings\Microsoft\WindowsApps\...']
      #   Failed to compile.
      #
      # The caller could not be identified from the logs: a --require shim that
      # wrapped fs.readdir/readdirSync/opendir was armed inside the very process
      # that failed and never fired, so the walk does not go through those (a
      # native scanner, or a worker that drops execArgv). Rather than keep
      # guessing, this points HOME/USERPROFILE at an empty directory for the build
      # step only — whatever walks the profile now walks nothing.
      #
      # Scoped to this step: `npm ci` ran earlier against the real profile, so the
      # npm cache is unaffected, and LOCALAPPDATA is left alone so electron-builder
      # keeps its download cache.
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOME: ${{ runner.temp }}/buildhome
          USERPROFILE: ${{ runner.temp }}/buildhome
        shell: bash
        run: |
          mkdir -p "$HOME"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            npm run build:app && node scripts/build-dist.mjs --win --publish always
          else
            npm run build:app && node scripts/build-dist.mjs --win --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — AppImage AND deb. The deb is not optional.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder shells out to these to build the .deb.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      # GITHUB_TOKEN is here for `@vscode/ripgrep`, whose postinstall downloads a
      # prebuilt binary through the GitHub API. Unauthenticated, that call is
      # rate-limited per runner IP and returns 403 — which is how the macOS job
      # failed on the first v1.0.0 attempt, after four retries, before any of our
      # own code ran. The token only raises the rate limit; nothing is published.
      - name: Install root dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Install shell dependencies
        working-directory: shell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # BOTH targets ship, and the .deb is the one that actually launches on a
      # modern Ubuntu: Chromium's SUID sandbox needs chrome-sandbox root-owned
      # 4755, a user-owned FUSE mount (which is what an AppImage is) cannot
      # provide that, and Ubuntu 23.10+ blocks the unprivileged-namespace
      # fallback. An AppImage-only release fails to start without --no-sandbox.
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            npm run build:app && node scripts/build-dist.mjs --linux --publish always
          else
            npm run build:app && node scripts/build-dist.mjs --linux --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
